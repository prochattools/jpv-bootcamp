name: Bootstrap Staging Database

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact full SHA of the approved non-main staging source ref'
        required: true
        type: string
      source_ref:
        description: 'Approved source ref: feature/*, fix/*, or release/*'
        required: true
        type: string
      confirmation:
        description: 'Exact confirmation: bootstrap-empty-staging-database'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-empty-database-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap isolated staging database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging-migration-plan

    steps:
      - name: Validate inputs and staging boundary
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.expected_sha }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$INPUT_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "BOOTSTRAP-DENIED: expected_sha must be a full lowercase SHA" >&2
            exit 1
          fi
          if ! printf '%s' "$INPUT_SOURCE_REF" | grep -qE '^(feature|fix|release)/[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "BOOTSTRAP-DENIED: source_ref must be feature/*, fix/*, or release/*" >&2
            exit 1
          fi
          if [ "$INPUT_CONFIRMATION" != "bootstrap-empty-staging-database" ]; then
            echo "BOOTSTRAP-DENIED: confirmation phrase is invalid" >&2
            exit 1
          fi
          echo "Staging-only bootstrap boundary validated"
          echo "target=jpvbootcamp_staging schema=jpvbootcamp_staging host=10.0.2.4 port=5433"

      - name: Check out approved source ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Attach approved source ref
        shell: bash
        env:
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: git switch --force-create "$SOURCE_REF_INPUT" HEAD

      - name: Verify exact source tip and reject main ancestry
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "$SOURCE_REF_INPUT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if git merge-base --is-ancestor "$EXPECTED_SHA" origin/main 2>/dev/null; then
            echo "BOOTSTRAP-DENIED: source SHA is already reachable from main" >&2
            exit 1
          fi
          test "$(git rev-parse "origin/$SOURCE_REF_INPUT")" = "$EXPECTED_SHA"
          echo "Source branch and remote tip verified"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify required staging secrets and mask database URL
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          test -n "${TAILSCALE_OAUTH_CLIENT_ID:-}"
          test -n "${TAILSCALE_OAUTH_SECRET:-}"
          echo "::add-mask::$DATABASE_URL"
          echo "Required staging migration secrets are present"

      - name: Connect to staging database network
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci-reader

      - name: Probe approved staging database path
        shell: bash
        run: |
          set -euo pipefail
          tailscale ping --timeout=10s 10.0.2.4
          nc -z -w 5 10.0.2.4 5433
          echo "Approved staging database path is reachable"

      - name: Run guarded empty-database bootstrap
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OPERATOR_ID: ${{ github.actor }}
        run: |
          set -euo pipefail
          STDOUT_FILE="$(mktemp)"
          STDERR_FILE="$(mktemp)"
          chmod 600 "$STDOUT_FILE" "$STDERR_FILE"
          trap 'rm -f "$STDOUT_FILE" "$STDERR_FILE"' EXIT
          set +e
          ./node_modules/.bin/tsx scripts/release/runStagingDatabaseBootstrap.ts \
            --operator-id="$OPERATOR_ID" \
            --backup-evidence-id=empty-staging-target-no-data \
            --maintenance-window-id=e1-gate-b-20260828 \
            --rollback-owner="$OPERATOR_ID" \
            --expected-commit="$EXPECTED_SHA" \
            --environment=staging \
            --target-id=jpvbootcamp-staging \
            --expected-schema=jpvbootcamp_staging \
            --expected-hostname=10.0.2.4 \
            --expected-database=jpvbootcamp_staging \
            --confirmation=bootstrap-empty-staging-database \
            >"$STDOUT_FILE" 2>"$STDERR_FILE"
          BOOTSTRAP_EXIT=$?
          set -e
          if [ "$BOOTSTRAP_EXIT" -ne 0 ]; then
            echo "BOOTSTRAP-DENIED: guarded staging bootstrap failed (exit=$BOOTSTRAP_EXIT)" >&2
            exit "$BOOTSTRAP_EXIT"
          fi
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(p.ok!==true||p.mode!=="bootstrap-empty-database"||p.environment!=="staging"||p.targetId!=="jpvbootcamp-staging"||p.database!=="jpvbootcamp_staging"||p.schema!=="jpvbootcamp_staging"||p.preflight?.targetWasEmpty!==true||p.postApply?.migrationState!=="VERIFIED"||p.postApply?.applicationPreflight!=="PASSED") process.exit(1)' "$STDOUT_FILE"
          cp "$STDOUT_FILE" staging-bootstrap-result.json
          echo "Staging bootstrap completed and verified"

      - name: Upload sanitized bootstrap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: staging-bootstrap-${{ github.run_id }}
          path: staging-bootstrap-result.json
          if-no-files-found: ignore
          retention-days: 30
