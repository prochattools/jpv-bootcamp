name: Manual Deploy Staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
      commit_sha:
        description: "Commit SHA"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Dokploy
        run: |
          RESPONSE=$(curl -s -o /tmp/deploy_response.json -w "%{http_code}" \
            -X POST "https://dokploy.prochat.tools/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"applicationId\": \"${{ secrets.DOKPLOY_APP_ID }}\",
              \"title\": \"fix: resolve 5 launch-critical staging failures\",
              \"description\": \"Commit: ${{ inputs.commit_sha }}\n\nImage: ${{ inputs.image_tag }}\"
            }")
          
          echo "Deploy response status: $RESPONSE"
          cat /tmp/deploy_response.json
          
          if [ "$RESPONSE" != "200" ]; then
            echo "Deployment failed with status $RESPONSE"
            exit 1
          fi
