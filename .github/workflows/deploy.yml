# Production build, publish, and deployment workflow.
#
# Trigger: push to main only. No workflow_dispatch.
#
# EXTERNAL CONFIGURATION REQUIRED (not enforced by this file alone):
#   GitHub Administrators must separately configure:
#   - A "production" GitHub Environment in Settings → Environments
#   - At least one required human reviewer on that environment
#   - Environment-scoped secrets: DOKPLOY_PROD_APP_ID, DOKPLOY_API_KEY
#   - Branch protection or a ruleset for "main" requiring:
#       - at least one approved review before merge
#       - required CI status checks before merge
#   The "environment: production" declaration below binds the job to that
#   environment but does NOT itself create or enforce reviewer protection.
#
# Required secrets (environment-scoped under "production"):
#   DOKPLOY_PROD_APP_ID  — canonical production Dokploy application ID
#   DOKPLOY_API_KEY      — Dokploy server API key

name: Build and Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Validate, build, publish, and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      packages: write
    env:
      APP_PUBLIC_URL: http://127.0.0.1:3107
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3107
      E2E_BASE_URL: http://127.0.0.1:3107

    steps:
      - name: Validate deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          # Reject any branch other than main
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "PRODUCTION-DEPLOY-DENIED: this workflow must only run on main. Got: ${{ github.ref_name }}" >&2
            exit 1
          fi
          # Require full 40-character SHA
          SHA="${{ github.sha }}"
          if ! echo "$SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "PRODUCTION-DEPLOY-DENIED: github.sha must be a full 40-character hex SHA." >&2
            exit 1
          fi
          echo "Deployment boundary validated: branch=main sha=$SHA"

      - name: Check out commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify SHA ancestry
        shell: bash
        run: |
          set -euo pipefail
          # Confirm the checked-out HEAD is the exact push SHA
          HEAD_SHA="$(git rev-parse HEAD)"
          PUSH_SHA="${{ github.sha }}"
          if [ "$HEAD_SHA" != "$PUSH_SHA" ]; then
            echo "PRODUCTION-DEPLOY-DENIED: checked-out HEAD ($HEAD_SHA) does not match push SHA ($PUSH_SHA)" >&2
            exit 1
          fi
          # Confirm branch context is main
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "PRODUCTION-DEPLOY-DENIED: ref_name must be main, got: ${{ github.ref_name }}" >&2
            exit 1
          fi
          # Confirm the SHA is reachable from local main (ancestry check)
          if ! git merge-base --is-ancestor "$PUSH_SHA" HEAD; then
            echo "PRODUCTION-DEPLOY-DENIED: push SHA is not an ancestor of current HEAD" >&2
            exit 1
          fi
          echo "SHA ancestry verified: $HEAD_SHA is main"

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.33.0
          # Pinned: pnpm@10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production deployment environment
        env:
          DOKPLOY_PROD_APP_ID: ${{ secrets.DOKPLOY_PROD_APP_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_SHA: ${{ github.sha }}
        run: pnpm exec tsx scripts/production-gates/checkProductionDeploymentEnv.mts

      - name: Type check payload config
        run: pnpm type-check:payload

      - name: Build application
        run: pnpm run build

      - name: Run deterministic non-browser release gate
        run: pnpm test:release

      - name: Install pinned Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run launch browser E2E
        run: pnpm test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable production image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=https://jpvbootcamp.com
            APP_BASE_URL=https://jpvbootcamp.com
            NEXT_PUBLIC_SERVER_URL=https://jpvbootcamp.com
            IMAGE_TAG=${{ github.sha }}
            COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=production-deploy
          cache-to: type=gha,mode=max,scope=production-deploy

      - name: Update Dokploy production image to immutable SHA tag
        env:
          DOKPLOY_PROD_APP_ID: ${{ secrets.DOKPLOY_PROD_APP_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          NEW_IMAGE="ghcr.io/${{ github.repository }}:${{ github.sha }}"

          UPDATE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://dokploy.prochat.tools/api/application.update" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"applicationId\": \"$DOKPLOY_PROD_APP_ID\",
              \"dockerImage\": \"$NEW_IMAGE\"
            }")

          echo "Image update HTTP status: $UPDATE_STATUS"
          if [ "$UPDATE_STATUS" != "200" ]; then
            echo "PRODUCTION-DEPLOY-DENIED: image update failed with HTTP $UPDATE_STATUS — deployment aborted." >&2
            exit 1
          fi
          echo "Production image updated to immutable tag: $NEW_IMAGE"

      - name: Trigger Dokploy production redeployment
        env:
          DOKPLOY_PROD_APP_ID: ${{ secrets.DOKPLOY_PROD_APP_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_MSG=$(git log -1 --pretty=format:"%s" ${{ github.sha }})
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an" ${{ github.sha }})
          COMMIT_DATE=$(git log -1 --pretty=format:"%ci" ${{ github.sha }})
          DESCRIPTION="${COMMIT_AUTHOR} · ${COMMIT_DATE}"$'\n\n'"${{ github.sha }}"

          DEPLOY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://dokploy.prochat.tools/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"applicationId\": \"$DOKPLOY_PROD_APP_ID\",
              \"title\": $(echo "$COMMIT_MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))'),
              \"description\": $(echo "$DESCRIPTION" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')
            }")

          echo "HTTP status: $DEPLOY_STATUS"

          if [ "$DEPLOY_STATUS" != "200" ]; then
            echo "PRODUCTION-DEPLOY-DENIED: Dokploy deployment trigger failed with HTTP $DEPLOY_STATUS" >&2
            exit 1
          fi

          echo "Deployment triggered successfully."
          echo "Provenance: deployed from $(git rev-parse HEAD)"

      - name: Wait for production SHA to become live
        env:
          PRODUCTION_URL: https://jpvbootcamp.com
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
        run: pnpm exec tsx scripts/production-gates/waitForProductionDeployment.mts
