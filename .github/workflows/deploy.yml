# GitHub Actions workflow — Build Docker image on GitHub, push to GHCR, trigger Dokploy redeploy.
# Copy to .github/workflows/deploy.yml in any repo that deploys to Dokploy via image pull.
#
# Required GitHub secrets:
#   DOKPLOY_API_KEY  — generate in Dokploy dashboard → Settings → API
#   DOKPLOY_APP_ID   — found in app settings URL in the Dokploy dashboard
#
# NEXT_PUBLIC_* vars:
#   These are baked into the JS bundle at build time (not injectable at runtime).
#   Pass them as build-args from GitHub repo variables (Settings → Variables → Actions).
#   See the commented build-args block below.
#
# Registry:
#   Images are pushed to GHCR (ghcr.io) using the built-in GITHUB_TOKEN.
#   Dokploy needs a read-only PAT (read:packages) registered in Dokploy Settings → Registry.

name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Uncomment and extend for apps with NEXT_PUBLIC_* env vars.
          # Values live in GitHub repo Settings → Variables → Actions (not secrets).
          # build-args: |
          #   NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}

      - name: Trigger Dokploy redeploy
        run: |
          DOKPLOY_URL="${{ secrets.DOKPLOY_URL || 'https://dokploy.prochat.tools' }}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"${{ secrets.DOKPLOY_APP_ID }}\"}")

          echo "HTTP status: $RESPONSE"

          if [ "$RESPONSE" != "200" ]; then
            echo "Dokploy trigger failed with status $RESPONSE"
            exit 1
          fi

          echo "Deployment triggered successfully."
