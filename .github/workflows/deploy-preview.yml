name: Staging Build and Deploy

# Third-party action SHAs pinned to verified releases (resolved via GitHub API):
#   actions/checkout@v4                   -> 11d5960a326750d5838078e36cf38b85af677262
#   pnpm/action-setup@v4                  -> b906affcce14559ad1aafd4ab0e942779e9f58b1
#   actions/setup-node@v4                 -> 49933ea5288caeca8642d1e84afbd3f7d6820020
#   tailscale/github-action@v4.1.3        -> 780049a30b6ff5c378a9e7b389d15ece7a204888
#   actions/upload-artifact@v4            -> ea165f8d65b6e75b540449e92b4886f43607fa02
#   docker/setup-buildx-action@v3         -> 8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
#   docker/login-action@v3                -> c94ce9fb468520275223c153574b00df6fe4bcc9
#   docker/build-push-action@v6           -> ca052bb54ab0790a636c9b5f226502c73d547a25
#
# Tailscale: OAuth scope auth_keys, subnet route 10.0.2.4/32, ACL tag:ci-reader -> 10.0.2.4:5433.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation: validate-only | deploy-preview (staging) | redeploy-staging-candidate (no build) | authenticated-acceptance (staging) | read-only-migration-plan | apply-rooms-migration (staging) | bootstrap-staging-database | backfill-administrator-members | seed-staging-qa-content'
        required: false
        type: string
        default: 'validate-only'
      expected_sha:
        description: 'Full 40-character SHA (required for deploy-preview, redeploy-staging-candidate, authenticated-acceptance, read-only-migration-plan, apply-rooms-migration, bootstrap-staging-database, backfill-administrator-members, and seed-staging-qa-content)'
        required: false
        type: string
      source_ref:
        description: 'Approved source ref: feature/*, fix/*, or release/* (never main)'
        required: true
        type: string
      confirmation:
        description: 'Confirmation phrase (deploy: deploy-staging-feature-tip; redeploy: redeploy-published-staging-candidate; acceptance: run-authenticated-staging-acceptance; plan: run-read-only-staging-payload-migration-plan; Rooms migration: apply-rooms-migration-to-jpvbootcamp-staging; bootstrap: bootstrap-empty-staging-database; backfill: apply-guarded-staging-administrator-member-backfill; seed: apply-guarded-staging-qa-content-seed)'
        required: false
        type: string
      backup_evidence_id:
        description: 'Non-secret backup/snapshot evidence reference (required only for apply-rooms-migration)'
        required: false
        type: string
      maintenance_window_id:
        description: 'Non-secret staging maintenance-window reference (required only for apply-rooms-migration)'
        required: false
        type: string
      rollback_owner:
        description: 'Named rollback owner reference (required only for apply-rooms-migration)'
        required: false
        type: string
permissions:
  contents: read
  packages: write

# Operation-aware concurrency: deploy runs share a cancellable group; plan,
# bootstrap, administrator backfill, and QA seed runs use separate non-cancellable groups.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'read-only-migration-plan' && 'staging-payload-migration-plan' || github.event_name == 'workflow_dispatch' && inputs.operation == 'apply-rooms-migration' && 'staging-rooms-migration-apply' || github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap-staging-database' && 'staging-empty-database-bootstrap' || github.event_name == 'workflow_dispatch' && inputs.operation == 'backfill-administrator-members' && 'staging-administrator-member-backfill' || github.event_name == 'workflow_dispatch' && inputs.operation == 'seed-staging-qa-content' && 'staging-qa-content-seed' || format('staging-deploy-{0}', github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.operation == 'read-only-migration-plan' || inputs.operation == 'apply-rooms-migration' || inputs.operation == 'bootstrap-staging-database' || inputs.operation == 'backfill-administrator-members' || inputs.operation == 'seed-staging-qa-content')) }}

jobs:
  validate-only:
    name: Validate, build, and test (manual staging gate)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: |
      github.event_name == 'workflow_dispatch' && (inputs.operation == 'validate-only' || inputs.operation == '')
    env:
      APP_PUBLIC_URL: http://127.0.0.1:3107
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3107
      E2E_BASE_URL: http://127.0.0.1:3107

    steps:
      - name: Validate deployment boundary
        shell: bash
        env:
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          # Canonical staging allow-list — no other target is permitted
          ALLOWED_SOURCE_REF_PATTERN='^(feature|fix|release)/[A-Za-z0-9][A-Za-z0-9._-]*$'
          ALLOWED_ORIGIN="https://staging.jpvbootcamp.com"
          ALLOWED_DOKPLOY_SLUG="clients-jpv-bootcamp-preview-wjfqfd"
          ALLOWED_DOKPLOY_ID="bZllV93NqsPZAFCsqDskb"
          ALLOWED_SCHEMA="jpvbootcamp"
          ALLOWED_HOST="10.0.2.4"
          ALLOWED_PORT="5433"
          ALLOWED_DB="jpvbootcamp_staging"

          if ! printf '%s' "$SOURCE_REF_INPUT" | grep -qE "$ALLOWED_SOURCE_REF_PATTERN"; then
            echo "DEPLOY-DENIED: source_ref must match feature/*, fix/*, or release/*; got '$SOURCE_REF_INPUT'" >&2
            exit 1
          fi
          if [ "$SOURCE_REF_INPUT" = "main" ]; then
            echo "DEPLOY-DENIED: source_ref main is never allowed for staging" >&2
            exit 1
          fi
          echo "Staging lane: source_ref=${SOURCE_REF_INPUT} origin=${ALLOWED_ORIGIN} schema=${ALLOWED_SCHEMA}"
          echo "              host=${ALLOWED_HOST} port=${ALLOWED_PORT} db=${ALLOWED_DB}"
          echo "              dokploy=${ALLOWED_DOKPLOY_SLUG} (${ALLOWED_DOKPLOY_ID})"

      - name: Check out commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Attach approved source ref for repository guards
        shell: bash
        env:
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: git switch --force-create "$SOURCE_REF_INPUT" HEAD

      - name: Verify SHA ancestry under approved source ref
        shell: bash
        env:
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          ALLOWED_REF="origin/${SOURCE_REF_INPUT}"
          CURRENT_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$CURRENT_SHA" "$ALLOWED_REF" 2>/dev/null; then
            echo "DEPLOY-DENIED: SHA $CURRENT_SHA is not an ancestor of $ALLOWED_REF" >&2
            echo "Only commits reachable from the approved source ref may be deployed here." >&2
            exit 1
          fi
          echo "SHA ancestry confirmed: $CURRENT_SHA is under $ALLOWED_REF"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check payload config
        run: pnpm type-check:payload

      - name: Build application
        run: pnpm run build

      - name: Run deterministic non-browser release gate
        run: pnpm test:release

      - name: Fix apt mirrors (replace dead Azure mirror with public archive)
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true

      - name: Install pinned Chromium browser
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: pnpm exec playwright install --with-deps chromium

      - name: Run launch browser E2E
        run: pnpm test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy-preview:
    name: Deploy staging (manual dispatch only)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging-deploy
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-preview'

    steps:
      - name: Validate inputs
        shell: bash
        env:
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${INPUT_EXPECTED_SHA}" | grep -qE '^[0-9a-f]{40}$'; then
            echo "DEPLOY-DENIED: expected_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
          EXPECTED_CONFIRMATION="deploy-staging-feature-tip"
          if [ "${INPUT_CONFIRMATION}" != "${EXPECTED_CONFIRMATION}" ]; then
            echo "DEPLOY-DENIED: confirmation must be exactly '${EXPECTED_CONFIRMATION}'" >&2
            exit 1
          fi

      - name: Validate deployment boundary
        shell: bash
        env:
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          # Canonical staging allow-list — no other target is permitted
          ALLOWED_SOURCE_REF_PATTERN='^(feature|fix|release)/[A-Za-z0-9][A-Za-z0-9._-]*$'
          ALLOWED_ORIGIN="https://staging.jpvbootcamp.com"
          ALLOWED_DOKPLOY_SLUG="clients-jpv-bootcamp-preview-wjfqfd"
          ALLOWED_DOKPLOY_ID="bZllV93NqsPZAFCsqDskb"
          ALLOWED_SCHEMA="jpvbootcamp"
          ALLOWED_HOST="10.0.2.4"
          ALLOWED_PORT="5433"
          ALLOWED_DB="jpvbootcamp_staging"

          if ! printf '%s' "$SOURCE_REF_INPUT" | grep -qE "$ALLOWED_SOURCE_REF_PATTERN"; then
            echo "DEPLOY-DENIED: source_ref must match feature/*, fix/*, or release/*; got '$SOURCE_REF_INPUT'" >&2
            exit 1
          fi
          if [ "$SOURCE_REF_INPUT" = "main" ]; then
            echo "DEPLOY-DENIED: source_ref main is never allowed for staging" >&2
            exit 1
          fi
          echo "Staging lane: source_ref=${SOURCE_REF_INPUT} origin=${ALLOWED_ORIGIN} schema=${ALLOWED_SCHEMA}"
          echo "              host=${ALLOWED_HOST} port=${ALLOWED_PORT} db=${ALLOWED_DB}"
          echo "              dokploy=${ALLOWED_DOKPLOY_SLUG} (${ALLOWED_DOKPLOY_ID})"

      - name: Check out approved source ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Attach approved source ref for repository guards
        shell: bash
        env:
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: git switch --force-create "$SOURCE_REF_INPUT" HEAD

      - name: Verify requested SHA is current remote tip of approved source ref
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          BRANCH_TIP="$(git rev-parse HEAD)"
          if [ "$BRANCH_TIP" != "$EXPECTED_SHA" ]; then
            echo "DEPLOY-DENIED: requested SHA ($EXPECTED_SHA) does not match the checked-out source ref tip ($BRANCH_TIP)" >&2
            exit 1
          fi
          REMOTE_TIP="$(git rev-parse "origin/$SOURCE_REF_INPUT")"
          if [ "$BRANCH_TIP" != "$REMOTE_TIP" ]; then
            echo "DEPLOY-DENIED: expected_sha is not the current remote tip of $SOURCE_REF_INPUT" >&2
            exit 1
          fi
          echo "SHA verified: $BRANCH_TIP is the current remote tip of $SOURCE_REF_INPUT"

      - name: Capture checkout SHA
        id: checkout-sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check payload config
        run: pnpm type-check:payload

      - name: Build application
        env:
          NEXT_PUBLIC_APP_URL: https://staging.jpvbootcamp.com
          APP_PUBLIC_URL: https://staging.jpvbootcamp.com
        run: pnpm run build

      - name: Run deterministic non-browser release gate
        run: pnpm test:release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Determine image tags
        id: image-tags
        shell: bash
        run: |
          set -euo pipefail
          sha_tag="ghcr.io/${{ github.repository }}:${{ steps.checkout-sha.outputs.sha }}"
          staging_tag="ghcr.io/${{ github.repository }}:staging"
          {
            echo "tags<<EOF"
            echo "$staging_tag"
            echo "$sha_tag"
            echo "EOF"
            echo "sha_tag=$sha_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_APP_URL=https://staging.jpvbootcamp.com
            APP_BASE_URL=https://staging.jpvbootcamp.com
            NEXT_PUBLIC_SERVER_URL=https://staging.jpvbootcamp.com
            IMAGE_TAG=${{ steps.checkout-sha.outputs.sha }}
            COMMIT_SHA=${{ steps.checkout-sha.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.checkout-sha.outputs.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            staging-origin=https://staging.jpvbootcamp.com
          cache-from: type=gha,scope=staging-deploy
          cache-to: type=gha,mode=max,scope=staging-deploy

      - name: Ensure durable staging media volume
        if: success()
        env:
          DOKPLOY_PREVIEW_APP_ID: ${{ secrets.DOKPLOY_PREVIEW_APP_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: pnpm exec tsx scripts/staging-gates/ensurePreviewMediaMount.mts

      - name: Ensure staging Traefik routing labels (application.update labelsSwarm)
        if: success()
        env:
          DOKPLOY_PREVIEW_APP_ID: ${{ secrets.DOKPLOY_PREVIEW_APP_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: pnpm exec tsx scripts/staging-gates/ensurePreviewRouting.mts

      - name: Ensure GHCR registry credentials in Dokploy
        if: success()
        env:
          DOKPLOY_PREVIEW_APP_ID: ${{ secrets.DOKPLOY_PREVIEW_APP_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: pnpm exec tsx scripts/staging-gates/ensureGhcrRegistryCredentials.mts

      - name: Trigger Dokploy redeploy
        if: success()
        shell: bash
        env:
          DOKPLOY_PREVIEW_APP_ID: ${{ secrets.DOKPLOY_PREVIEW_APP_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          GITHUB_TOKEN_LOGIN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Positive allow-list: only the canonical staging Dokploy app is permitted
          ALLOWED_SLUG="clients-jpv-bootcamp-preview-wjfqfd"
          ALLOWED_INTERNAL_ID="bZllV93NqsPZAFCsqDskb"

          if [ -z "$DOKPLOY_PREVIEW_APP_ID" ]; then
            echo "DEPLOY-DENIED: DOKPLOY_PREVIEW_APP_ID secret is unset or empty" >&2
            exit 1
          fi
          if [ "$DOKPLOY_PREVIEW_APP_ID" != "$ALLOWED_SLUG" ] && [ "$DOKPLOY_PREVIEW_APP_ID" != "$ALLOWED_INTERNAL_ID" ]; then
            echo "DEPLOY-DENIED: DOKPLOY_PREVIEW_APP_ID ('$DOKPLOY_PREVIEW_APP_ID') does not match allowed staging target" >&2
            echo "  Allowed: $ALLOWED_SLUG or $ALLOWED_INTERNAL_ID" >&2
            echo "  No other target is permitted." >&2
            exit 1
          fi
          echo "Deploy guard passed: DOKPLOY_PREVIEW_APP_ID matches canonical staging target"

          NEW_IMAGE="${{ steps.image-tags.outputs.sha_tag }}"
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" ${{ steps.checkout-sha.outputs.sha }})
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an" ${{ steps.checkout-sha.outputs.sha }})
          COMMIT_DATE=$(git log -1 --pretty=format:"%ci" ${{ steps.checkout-sha.outputs.sha }})
          DESCRIPTION="${COMMIT_AUTHOR} · ${COMMIT_DATE}"$'\n\n'"${{ steps.checkout-sha.outputs.sha }}"

          UPDATE_RESPONSE=$(curl -s -o /tmp/dokploy_update_response.json -w "%{http_code}" \
            -X POST "https://dokploy.prochat.tools/api/application.update" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"applicationId\": \"$DOKPLOY_PREVIEW_APP_ID\",
              \"dockerImage\": \"$NEW_IMAGE\"
            }")

          echo "Image update HTTP status: $UPDATE_RESPONSE"
          if [ "$UPDATE_RESPONSE" != "200" ]; then
            echo "Warning: image update returned $UPDATE_RESPONSE — continuing with deploy"
            cat /tmp/dokploy_update_response.json || true
          else
            echo "Image updated to: $NEW_IMAGE"
          fi

          RESPONSE=$(curl -s -o /tmp/dokploy_response.json -w "%{http_code}" \
            -X POST "https://dokploy.prochat.tools/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"applicationId\": \"$DOKPLOY_PREVIEW_APP_ID\",
              \"title\": $(echo \"$COMMIT_MSG\" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))'),
              \"description\": $(echo \"$DESCRIPTION\" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')
            }")

          echo "HTTP status: $RESPONSE"
          echo "Deploy API response status recorded (body suppressed from logs)"

          if [ "$RESPONSE" != "200" ]; then
            echo "Dokploy trigger failed with status $RESPONSE"
            exit 1
          fi

          echo "Deployment triggered successfully for: $NEW_IMAGE"
          echo "Provenance: deployed from $(git rev-parse HEAD)"

      - name: Verify staging admin secret readiness
        if: success()
        shell: bash
        env:
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_ADMIN_EMAIL" ]; then
            echo "ADMIN-RESPONSIVE-DENIED: repository or preview environment secret STAGING_ADMIN_EMAIL is missing" >&2
            exit 1
          fi
          if [ -z "$STAGING_ADMIN_PASSWORD" ]; then
            echo "ADMIN-RESPONSIVE-DENIED: repository or preview environment secret STAGING_ADMIN_PASSWORD is missing" >&2
            exit 1
          fi
          echo "Required staging admin secret names are configured"

      - name: Wait for deployed staging revision
        if: success()
        env:
          STAGING_URL: https://staging.jpvbootcamp.com
          EXPECTED_DEPLOYMENT_SHA: ${{ steps.checkout-sha.outputs.sha }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_PREVIEW_APP_ID: ${{ secrets.DOKPLOY_PREVIEW_APP_ID }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: pnpm exec tsx scripts/staging-gates/waitForPreviewDeployment.mts

      - name: Diagnose Dokploy deployment (on wait failure)
        if: failure()
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: pnpm exec tsx scripts/staging-gates/diagnoseDokployDeployment.mts || true

      - name: Fix apt mirrors (replace dead Azure mirror with public archive)
        if: success()
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true

      - name: Install pinned Chromium browser
        if: success()
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated staging admin responsive gate
        if: success()
        env:
          STAGING_URL: https://staging.jpvbootcamp.com
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: pnpm test:e2e:admin-responsive

      - name: Upload authenticated admin failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-responsive-failure-${{ github.run_id }}
          path: /tmp/jpv-admin-regression-hardening/
          if-no-files-found: ignore
          retention-days: 7

  apply-rooms-migration:
    name: Apply the exact Rooms Payload migration to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging-migration-plan
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'apply-rooms-migration'
    permissions:
      contents: read

    steps:
      - name: Validate exact Rooms migration inputs
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKUP_EVIDENCE_ID: ${{ inputs.backup_evidence_id }}
          MAINTENANCE_WINDOW_ID: ${{ inputs.maintenance_window_id }}
          ROLLBACK_OWNER: ${{ inputs.rollback_owner }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$EXPECTED_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "ROOMS-MIGRATION-DENIED: expected_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
          if ! printf '%s' "$SOURCE_REF_INPUT" | grep -qE '^(feature|fix|release)/[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "ROOMS-MIGRATION-DENIED: source_ref must match feature/*, fix/*, or release/*" >&2
            exit 1
          fi
          if [ "$CONFIRMATION" != "apply-rooms-migration-to-jpvbootcamp-staging" ]; then
            echo "ROOMS-MIGRATION-DENIED: confirmation phrase is invalid" >&2
            exit 1
          fi
          if [ -z "${BACKUP_EVIDENCE_ID:-}" ] || [ -z "${MAINTENANCE_WINDOW_ID:-}" ] || [ -z "${ROLLBACK_OWNER:-}" ]; then
            echo "ROOMS-MIGRATION-DENIED: backup evidence, maintenance window, and rollback owner references are required" >&2
            exit 1
          fi
          echo "Rooms migration dispatch input boundary validated"

      - name: Verify protected migration approval and rollback readiness gates
        shell: bash
        env:
          PLAN_READY_FOR_DISPATCH: ${{ vars.PLAN_READY_FOR_DISPATCH }}
          SOLO_OPERATOR_MODE: ${{ vars.SOLO_OPERATOR_MODE }}
          ROOMS_MIGRATION_APPROVED: ${{ vars.ROOMS_MIGRATION_APPROVED }}
          ROOMS_MIGRATION_ROLLBACK_READY: ${{ vars.ROOMS_MIGRATION_ROLLBACK_READY }}
        run: |
          set -euo pipefail
          if [ "${PLAN_READY_FOR_DISPATCH:-}" != "true" ]; then
            echo "ROOMS-MIGRATION-DENIED: PLAN_READY_FOR_DISPATCH must be true in staging-migration-plan" >&2
            exit 1
          fi
          if [ "${SOLO_OPERATOR_MODE:-}" != "true" ]; then
            echo "ROOMS-MIGRATION-DENIED: SOLO_OPERATOR_MODE must be true in staging-migration-plan" >&2
            exit 1
          fi
          if [ "${ROOMS_MIGRATION_APPROVED:-}" != "true" ]; then
            echo "ROOMS-MIGRATION-DENIED: ROOMS_MIGRATION_APPROVED must be true after explicit staging approval" >&2
            exit 1
          fi
          if [ "${ROOMS_MIGRATION_ROLLBACK_READY:-}" != "true" ]; then
            echo "ROOMS-MIGRATION-DENIED: ROOMS_MIGRATION_ROLLBACK_READY must be true after external backup/restore evidence is recorded" >&2
            exit 1
          fi
          echo "Protected staging migration approval and rollback-readiness gates confirmed"

      - name: Check out approved source ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Verify exact candidate and control-only source delta
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          git switch --force-create "$SOURCE_REF_INPUT" HEAD
          SOURCE_TIP="$(git rev-parse HEAD)"
          if [ "$(git branch --show-current)" != "$SOURCE_REF_INPUT" ]; then
            echo "ROOMS-MIGRATION-DENIED: checked-out branch does not match source_ref" >&2
            exit 1
          fi
          if [ "$(git rev-parse "origin/$SOURCE_REF_INPUT")" != "$SOURCE_TIP" ]; then
            echo "ROOMS-MIGRATION-DENIED: source_ref is not the current remote tip" >&2
            exit 1
          fi
          if ! git cat-file -e "$EXPECTED_SHA^{commit}"; then
            echo "ROOMS-MIGRATION-DENIED: expected candidate SHA is not present in the approved source" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" "$SOURCE_TIP"; then
            echo "ROOMS-MIGRATION-DENIED: expected candidate SHA is not an ancestor of the approved source tip" >&2
            exit 1
          fi
          if git merge-base --is-ancestor "$EXPECTED_SHA" origin/main 2>/dev/null; then
            echo "ROOMS-MIGRATION-DENIED: expected candidate SHA is reachable from main" >&2
            exit 1
          fi
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/deploy-preview.yml|scripts/release/releaseTestManifest.ts|scripts/release/runRoomsStagingPayloadMigration.ts|scripts/release/runRoomsStagingPayloadMigration.test.ts|scripts/rooms_staging_release_controls.test.ts|docs/client/OPERATOR_HANDOFF_SUMMARY.md|docs/client/ROADMAP_PROGRESS_STATUS.md|docs/PREVIEW_RELEASE_READINESS.md) ;;
              '') ;;
              *)
                echo "ROOMS-MIGRATION-DENIED: source delta after candidate includes non-control path '$changed'" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$EXPECTED_SHA" "$SOURCE_TIP")
          echo "Candidate SHA and control-only source delta verified"
          echo "source-tip=$SOURCE_TIP"
          echo "SOURCE_TIP=$SOURCE_TIP" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Verify, mask, and use protected staging migration secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ] || [ -z "${PAYLOAD_SECRET:-}" ] || [ -z "${TAILSCALE_OAUTH_CLIENT_ID:-}" ] || [ -z "${TAILSCALE_OAUTH_SECRET:-}" ]; then
            echo "ROOMS-MIGRATION-DENIED: required protected staging secrets are missing" >&2
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$PAYLOAD_SECRET"
          echo "Required protected staging migration secrets are present"

      - name: Connect to approved staging database network
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci-reader

      - name: Probe approved staging database path
        shell: bash
        run: |
          set -euo pipefail
          tailscale ping --timeout=10s 10.0.2.4
          nc -z -w 5 10.0.2.4 5433
          echo "Approved staging database path is reachable"

      - name: Apply Rooms migration once and capture sanitized evidence
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          PAYLOAD_MIGRATION_SCHEMA: jpvbootcamp
          NODE_ENV: production
          DEPLOYMENT_ENV: staging
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OPERATOR_ID: ${{ github.actor }}
          BACKUP_EVIDENCE_ID: ${{ inputs.backup_evidence_id }}
          MAINTENANCE_WINDOW_ID: ${{ inputs.maintenance_window_id }}
          ROLLBACK_OWNER: ${{ inputs.rollback_owner }}
        run: |
          set -euo pipefail
          SOURCE_TIP="$(git rev-parse HEAD)"
          RAW_RESULT="$(mktemp)"
          RAW_ERROR="$(mktemp)"
          trap 'rm -f "$RAW_RESULT" "$RAW_ERROR"' EXIT
          set +e
          ./node_modules/.bin/tsx scripts/release/runRoomsStagingPayloadMigration.ts \
            "--operator-id=$OPERATOR_ID" \
            "--backup-evidence-id=$BACKUP_EVIDENCE_ID" \
            "--maintenance-window-id=$MAINTENANCE_WINDOW_ID" \
            "--rollback-owner=$ROLLBACK_OWNER" \
            "--expected-commit=$EXPECTED_SHA" \
            "--source-tip=$SOURCE_TIP" \
            "--environment=staging" \
            "--target-id=jpvbootcamp-staging" \
            "--expected-schema=jpvbootcamp" \
            "--expected-hostname=10.0.2.4" \
            "--expected-database=jpvbootcamp_staging" \
            "--expected-port=5433" \
            "--confirmation=apply-rooms-migration-to-jpvbootcamp-staging" \
            "--migration-approval=approved" \
            "--rollback-readiness=ready" \
            > "$RAW_RESULT" 2> "$RAW_ERROR"
          APPLY_EXIT=$?
          set -e

          if [ ! -s "$RAW_RESULT" ]; then
            printf '%s\n' '{"version":1,"operation":"apply-rooms-migration","ok":false,"resultCode":"blocked","environment":"staging","targetId":"jpvbootcamp-staging","schema":"jpvbootcamp","commit":"unknown","sourceTip":"unknown","migration":"20260830_090000_member_portal_rooms","blockers":["result_missing"]}' > rooms-staging-migration-result.json
            echo "ROOMS-MIGRATION-DENIED: sanitized result was not produced; raw diagnostics suppressed" >&2
            exit 1
          fi
          if ! node - "$RAW_RESULT" "$EXPECTED_SHA" "$SOURCE_TIP" <<'NODE'
          const fs = require('node:fs')
          const [file, expectedSha, sourceTip] = process.argv.slice(2)
          const raw = fs.readFileSync(file, 'utf8')
          if (/postgres(ql)?:\/\/|DATABASE_URL|PAYLOAD_SECRET|password\s*=|secret\s*=/i.test(raw)) process.exit(2)
          let result
          try { result = JSON.parse(raw) } catch { process.exit(3) }
          if (result.version !== 1 || result.operation !== 'apply-rooms-migration' || result.migration !== '20260830_090000_member_portal_rooms') process.exit(4)
          if (result.environment !== 'staging' || result.targetId !== 'jpvbootcamp-staging' || result.schema !== 'jpvbootcamp') process.exit(5)
          if (result.commit !== expectedSha || result.sourceTip !== sourceTip) process.exit(6)
          if (!Array.isArray(result.blockers)) process.exit(7)
          if (result.resultCode === 'applied' && (!result.ok || !Array.isArray(result.postApply?.missingPayloadMigrations) || result.postApply.missingPayloadMigrations.length !== 0)) process.exit(8)
          if (result.resultCode !== 'applied' && result.ok) process.exit(9)
          NODE
          then
            echo "ROOMS-MIGRATION-DENIED: sanitized result validation failed; raw diagnostics suppressed" >&2
            exit 1
          fi
          cp "$RAW_RESULT" rooms-staging-migration-result.json
          if [ "$APPLY_EXIT" -ne 0 ]; then
            echo "ROOMS-MIGRATION-DENIED: migration result is blocked or uncertain; inspect sanitized artifact" >&2
            exit "$APPLY_EXIT"
          fi
          echo "Rooms migration applied and post-apply clean plan verified"

      - name: Upload sanitized Rooms migration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-rooms-migration-${{ github.run_id }}
          path: rooms-staging-migration-result.json
          retention-days: 30
          if-no-files-found: ignore

  redeploy-staging-candidate:
    name: Redeploy published staging candidate (no build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging-deploy
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'redeploy-staging-candidate'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Validate no-build candidate redeploy inputs
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$EXPECTED_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "REDEPLOY-DENIED: expected_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
          if ! printf '%s' "$SOURCE_REF_INPUT" | grep -qE '^(feature|fix|release)/[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "REDEPLOY-DENIED: source_ref must match feature/*, fix/*, or release/*" >&2
            exit 1
          fi
          if [ "$CONFIRMATION" != "redeploy-published-staging-candidate" ]; then
            echo "REDEPLOY-DENIED: confirmation phrase is invalid" >&2
            exit 1
          fi
          echo "No-build staging candidate redeploy boundary validated"

      - name: Check out approved source ref for provenance verification
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Verify candidate ancestry and no-build source boundary
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          SOURCE_TIP="$(git rev-parse HEAD)"
          if [ "$(git rev-parse "origin/$SOURCE_REF_INPUT")" != "$SOURCE_TIP" ]; then
            echo "REDEPLOY-DENIED: source_ref is not the current remote tip" >&2
            exit 1
          fi
          if ! git cat-file -e "$EXPECTED_SHA^{commit}" || ! git merge-base --is-ancestor "$EXPECTED_SHA" "$SOURCE_TIP"; then
            echo "REDEPLOY-DENIED: expected candidate SHA is not contained in approved source ref" >&2
            exit 1
          fi
          if git merge-base --is-ancestor "$EXPECTED_SHA" origin/main 2>/dev/null; then
            echo "REDEPLOY-DENIED: expected candidate SHA is reachable from main" >&2
            exit 1
          fi
          echo "Candidate provenance verified; no source build will run"

      - name: Set up Docker Buildx for registry inspection
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR for candidate availability check
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prove immutable candidate image is available
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${{ github.repository }}:${EXPECTED_SHA}"
          docker buildx imagetools inspect "$IMAGE" >/tmp/rooms-candidate-image.txt
          grep -q "$EXPECTED_SHA" /tmp/rooms-candidate-image.txt
          echo "Published immutable candidate image is available: $IMAGE"

      - name: Update only canonical staging Dokploy app to the published image
        shell: bash
        env:
          DOKPLOY_PREVIEW_APP_ID: ${{ secrets.DOKPLOY_PREVIEW_APP_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          ALLOWED_SLUG="clients-jpv-bootcamp-preview-wjfqfd"
          ALLOWED_INTERNAL_ID="bZllV93NqsPZAFCsqDskb"
          if [ "$DOKPLOY_PREVIEW_APP_ID" != "$ALLOWED_SLUG" ] && [ "$DOKPLOY_PREVIEW_APP_ID" != "$ALLOWED_INTERNAL_ID" ]; then
            echo "REDEPLOY-DENIED: Dokploy application is not the canonical staging target" >&2
            exit 1
          fi
          IMAGE="ghcr.io/${{ github.repository }}:${EXPECTED_SHA}"
          UPDATE_PAYLOAD="$(IMAGE="$IMAGE" APP_ID="$DOKPLOY_PREVIEW_APP_ID" python3 - <<'PY'
          import json, os
          print(json.dumps({'applicationId': os.environ['APP_ID'], 'dockerImage': os.environ['IMAGE']}))
          PY
          )"
          UPDATE_STATUS="$(curl --silent --show-error --output /tmp/rooms-dokploy-update.json --write-out '%{http_code}' --max-time 20 \
            -X POST 'https://dokploy.prochat.tools/api/application.update' \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' -d "$UPDATE_PAYLOAD")"
          if [ "$UPDATE_STATUS" != "200" ]; then
            echo "REDEPLOY-DENIED: Dokploy image update returned HTTP $UPDATE_STATUS" >&2
            exit 1
          fi
          DEPLOY_PAYLOAD="$(EXPECTED_SHA="$EXPECTED_SHA" APP_ID="$DOKPLOY_PREVIEW_APP_ID" python3 - <<'PY'
          import json, os
          print(json.dumps({'applicationId': os.environ['APP_ID'], 'title': 'Rooms staging candidate redeploy', 'description': os.environ['EXPECTED_SHA']}))
          PY
          )"
          DEPLOY_STATUS="$(curl --silent --show-error --output /tmp/rooms-dokploy-deploy.json --write-out '%{http_code}' --max-time 20 \
            -X POST 'https://dokploy.prochat.tools/api/application.deploy' \
            -H "x-api-key: $DOKPLOY_API_KEY" -H 'Content-Type: application/json' -d "$DEPLOY_PAYLOAD")"
          if [ "$DEPLOY_STATUS" != "200" ]; then
            echo "REDEPLOY-DENIED: Dokploy staging redeploy returned HTTP $DEPLOY_STATUS" >&2
            exit 1
          fi
          echo "Canonical staging Dokploy redeploy triggered for the published candidate image"

      - name: Wait for exact candidate staging runtime
        env:
          STAGING_URL: https://staging.jpvbootcamp.com
          EXPECTED_DEPLOYMENT_SHA: ${{ inputs.expected_sha }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_PREVIEW_APP_ID: ${{ secrets.DOKPLOY_PREVIEW_APP_ID }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: pnpm exec tsx scripts/staging-gates/waitForPreviewDeployment.mts

      - name: Diagnose no-build staging redeploy on failure
        if: failure()
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: pnpm exec tsx scripts/staging-gates/diagnoseDokployDeployment.mts || true

  a6-authenticated-acceptance:
    name: A6 authenticated member and creator/admin acceptance (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging-deploy
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'authenticated-acceptance'
    permissions:
      contents: read

    steps:
      - name: Validate exact candidate inputs
        shell: bash
        env:
          INPUT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$INPUT_EXPECTED_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "A6-AUTH-DENIED: expected_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
          if ! printf '%s' "$INPUT_SOURCE_REF" | grep -qE '^(feature|fix|release)/[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "A6-AUTH-DENIED: source_ref must match feature/*, fix/*, or release/*; main is forbidden" >&2
            exit 1
          fi
          if [ "$INPUT_CONFIRMATION" != "run-authenticated-staging-acceptance" ]; then
            echo "A6-AUTH-DENIED: confirmation must be exactly 'run-authenticated-staging-acceptance'" >&2
            exit 1
          fi

      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Verify runtime SHA is an ancestor of the approved test harness
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git rev-parse "origin/${SOURCE_REF_INPUT}")"
          if [ "$CURRENT_SHA" != "$REMOTE_SHA" ] || ! git merge-base --is-ancestor "$EXPECTED_SHA" "$CURRENT_SHA" 2>/dev/null; then
            echo "A6-AUTH-DENIED: approved test harness must be the remote ref tip and contain expected_sha" >&2
            exit 1
          fi
          echo "Exact deployed runtime candidate is an ancestor of the approved staging test harness"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deployed staging runtime is the exact candidate
        shell: bash
        env:
          STAGING_URL: https://staging.jpvbootcamp.com
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          HEALTH_FILE="$(mktemp /tmp/jpv-a6-health.XXXXXX.json)"
          trap 'rm -f "$HEALTH_FILE"' EXIT
          curl --fail --silent --show-error --max-time 20 "$STAGING_URL/api/health" > "$HEALTH_FILE"
          HEALTH_FILE="$HEALTH_FILE" EXPECTED_SHA="$EXPECTED_SHA" node <<'NODE'
          const fs = require('node:fs')
          const health = JSON.parse(fs.readFileSync(process.env.HEALTH_FILE, 'utf8'))
          const expected = process.env.EXPECTED_SHA
          const identities = [
            health.commit,
            health.sha,
            health.image,
            health.imageTag,
            health.build?.commit,
            health.build?.sha,
            health.build?.image,
            health.build?.imageTag,
          ].filter((value) => typeof value === 'string')
          if (String(health.deploymentEnv ?? '').toLowerCase() !== 'staging') {
            console.error('A6-AUTH-DENIED: staging health did not report deploymentEnv=staging')
            process.exit(1)
          }
          if (!identities.includes(expected)) {
            console.error('A6-AUTH-DENIED: staging health did not report the exact expected candidate SHA')
            process.exit(1)
          }
          console.log('Exact staging runtime candidate verified')
          NODE

      - name: Verify protected actor secrets are present
        shell: bash
        env:
          STAGING_MEMBER_EMAIL: ${{ secrets.STAGING_MEMBER_EMAIL }}
          STAGING_MEMBER_PASSWORD: ${{ secrets.STAGING_MEMBER_PASSWORD }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_MEMBER_EMAIL:-}" ] || [ -z "${STAGING_MEMBER_PASSWORD:-}" ]; then
            echo "A6 BLOCKED — ADD STAGING_MEMBER_EMAIL AND STAGING_MEMBER_PASSWORD" >&2
            echo "A6-AUTH-DENIED: add STAGING_MEMBER_EMAIL and STAGING_MEMBER_PASSWORD as protected staging secrets" >&2
            exit 1
          fi
          if [ -z "${STAGING_ADMIN_EMAIL:-}" ] || [ -z "${STAGING_ADMIN_PASSWORD:-}" ]; then
            echo "A6-AUTH-DENIED: STAGING_ADMIN_EMAIL and STAGING_ADMIN_PASSWORD are required protected staging secrets" >&2
            exit 1
          fi
          echo "Protected actor secret names are configured"

      - name: Fix apt mirrors (replace dead Azure mirror with public archive)
        if: success()
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true

      - name: Install pinned Chromium browser
        if: success()
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: pnpm exec playwright install --with-deps chromium

      - name: Run authenticated member and creator/admin acceptance
        if: success()
        env:
          STAGING_URL: https://staging.jpvbootcamp.com
          STAGING_MEMBER_EMAIL: ${{ secrets.STAGING_MEMBER_EMAIL }}
          STAGING_MEMBER_PASSWORD: ${{ secrets.STAGING_MEMBER_PASSWORD }}
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: pnpm test:e2e:staging:authenticated

      - name: Upload aggregate authenticated-gate failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: a6-authenticated-failure-${{ github.run_id }}
          path: /tmp/jpv-a6-authenticated-staging/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  bootstrap-staging-database:
    name: Bootstrap isolated staging database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging-migration-plan
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap-staging-database'
    permissions:
