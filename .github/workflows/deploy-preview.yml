# Deploy feature branches to preview/staging environment.
# - Builds Docker image on GitHub
# - Pushes to GHCR with branch tag
# - Triggers Dokploy preview app redeployment
#
# Required GitHub secrets:
#   DOKPLOY_PREVIEW_APP_ID — Dokploy application ID for the preview/staging app
#   DOKPLOY_API_KEY        — Dokploy server API key
#   DOKPLOY_API_BASE_URL   — Dokploy API base URL (e.g., https://dokploy.prochat.tools)

name: Build and Deploy to Preview

on:
  push:
    branches:
      - 'feature/**'
      - 'pr/**'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation: deploy-preview or read-only-migration-plan'
        required: false
        type: choice
        options:
          - deploy-preview
          - read-only-migration-plan
        default: 'deploy-preview'
      branch_or_ref:
        description: Branch or commit SHA to deploy (deploy-preview only)
        required: false
        type: string
        default: 'feature/course-branding-and-preview'
      expected_sha:
        description: 'Full 40-character SHA required for read-only-migration-plan'
        required: false
        type: string
      confirmation:
        description: 'Confirmation phrase (read-only-migration-plan: run-read-only-staging-payload-migration-plan)'
        required: false
        type: string

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tag
        id: docker-tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAG="latest"
          else
            TAG=$(echo "${{ github.ref_name }}" | sed 's|/|-|g')
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.docker-tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image pushed to GHCR
        run: |
          echo "✅ Docker image built and pushed to GHCR:"
          echo "   ghcr.io/${{ github.repository }}:${{ steps.docker-tag.outputs.tag }}"
          echo ""
          echo "Dokploy staging app will pull and redeploy automatically."
          echo "Access preview at: https://preview.jpvbootcamp.com"
