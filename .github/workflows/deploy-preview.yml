name: Preview Build and Deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation: deploy-preview or read-only-migration-plan'
        required: false
        type: choice
        options:
          - deploy-preview
          - read-only-migration-plan
        default: 'deploy-preview'
      branch_or_ref:
        description: Branch or commit SHA to deploy (deploy-preview only)
        required: false
        type: string
        default: 'feature/course-branding-and-preview'
      expected_sha:
        description: 'Full 40-character SHA required for read-only-migration-plan'
        required: false
        type: string
      confirmation:
        description: 'Confirmation phrase (read-only-migration-plan: run-read-only-staging-payload-migration-plan)'
        required: false
        type: string
  push:
    branches:
      - 'feature/**'
      - 'pr/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-publish:
    name: Validate, build, publish, and deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: preview-deploy
    if: |
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[migration-plan-only]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-preview')
    env:
      APP_PUBLIC_URL: http://127.0.0.1:3107
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3107
      E2E_BASE_URL: http://127.0.0.1:3107

    steps:
      - name: Validate deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          # Reject main branch deployments from this workflow
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "DEPLOY-DENIED: this workflow must not run on main. Only feature/course-branding-and-preview is allowed." >&2
            exit 1
          fi
          # Reject generic workflow_dispatch input pointing at main
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_REF="${{ inputs.branch_or_ref }}"
            if [ "$INPUT_REF" = "main" ] || [ "$INPUT_REF" = "refs/heads/main" ]; then
              echo "DEPLOY-DENIED: branch_or_ref 'main' is not allowed. Use feature/course-branding-and-preview." >&2
              exit 1
            fi
          fi

      - name: Check out commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch_or_ref || github.ref }}
          fetch-depth: 0

      - name: Verify SHA ancestry under feature branch
        shell: bash
        run: |
          set -euo pipefail
          ALLOWED_BRANCH="origin/feature/course-branding-and-preview"
          CURRENT_SHA="$(git rev-parse HEAD)"
          # Confirm HEAD is reachable from the allowed branch
          if ! git merge-base --is-ancestor "$CURRENT_SHA" "$ALLOWED_BRANCH" 2>/dev/null; then
            echo "DEPLOY-DENIED: SHA $CURRENT_SHA is not an ancestor of $ALLOWED_BRANCH" >&2
            echo "Only commits reachable from feature/course-branding-and-preview may be deployed here." >&2
            exit 1
          fi
          echo "SHA ancestry confirmed: $CURRENT_SHA is under $ALLOWED_BRANCH"

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.33.0
          # Pinned: pnpm@10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check payload config
        run: pnpm type-check:payload

      - name: Build application
        run: pnpm run build

      - name: Run deterministic non-browser release gate
        run: pnpm test:release

      - name: Install pinned Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run launch browser E2E
        run: pnpm test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Determine image tags
        id: image-tags
        shell: bash
        run: |
          set -euo pipefail
          sha_tag="ghcr.io/${{ github.repository }}:${{ github.sha }}"
          branch_ref="${{ github.ref_name }}"
          branch_tag="ghcr.io/${{ github.repository }}:$(printf '%s' "$branch_ref" | sed 's|/|-|g')"
          {
            echo "tags<<EOF"
            echo "$branch_tag"
            echo "$sha_tag"
            echo "EOF"
            echo "sha_tag=$sha_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Verify Docker build (dry run)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          build-args: |
            NEXT_PUBLIC_APP_URL=https://preview.jpvbootcamp.com
            APP_BASE_URL=https://preview.jpvbootcamp.com
            NEXT_PUBLIC_SERVER_URL=https://preview.jpvbootcamp.com
            IMAGE_TAG=${{ github.sha }}
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=preview-deploy

      - name: Build and publish immutable image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_APP_URL=https://preview.jpvbootcamp.com
            APP_BASE_URL=https://preview.jpvbootcamp.com
            NEXT_PUBLIC_SERVER_URL=https://preview.jpvbootcamp.com
            IMAGE_TAG=${{ github.sha }}
            COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=preview-deploy
          cache-to: type=gha,mode=max,scope=preview-deploy

      - name: Ensure durable staging media volume
        if: success()
        env:
          DOKPLOY_PREVIEW_APP_ID: ${{ secrets.DOKPLOY_PREVIEW_APP_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: pnpm exec tsx scripts/staging-gates/ensurePreviewMediaMount.mts

      - name: Trigger Dokploy redeploy
        if: success()
        shell: bash
        env:
          DOKPLOY_PREVIEW_APP_ID: ${{ secrets.DOKPLOY_PREVIEW_APP_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          GITHUB_TOKEN_LOGIN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Hard deployment boundary guard — fail closed before any API call
          # Deny-list: production app IDs (both slug and internal formats)
          DENIED_SLUG="web-public-jpv-bootcamp-l66egq"
          DENIED_INTERNAL="l66egq"

          if [ -z "$DOKPLOY_PREVIEW_APP_ID" ]; then
            echo "DEPLOY-DENIED: DOKPLOY_PREVIEW_APP_ID secret is unset or empty" >&2
            exit 1
          fi
          if [ "$DOKPLOY_PREVIEW_APP_ID" = "$DENIED_SLUG" ]; then
            echo "DEPLOY-DENIED: DOKPLOY_PREVIEW_APP_ID matches production deny-list: $DENIED_SLUG" >&2
            exit 1
          fi
          if echo "$DOKPLOY_PREVIEW_APP_ID" | grep -qi "$DENIED_INTERNAL"; then
            echo "DEPLOY-DENIED: DOKPLOY_PREVIEW_APP_ID contains production identifier fragment" >&2
            exit 1
          fi
          echo "Deploy guard passed: DOKPLOY_PREVIEW_APP_ID is not on deny-list"

          NEW_IMAGE="${{ steps.image-tags.outputs.sha_tag }}"
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" ${{ github.sha }})
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an" ${{ github.sha }})
          COMMIT_DATE=$(git log -1 --pretty=format:"%ci" ${{ github.sha }})
          DESCRIPTION="${COMMIT_AUTHOR} · ${COMMIT_DATE}"$'\n\n'"${{ github.sha }}"

          # Step 1: Update the application's Docker image to the new SHA
          # This ensures Dokploy pulls the new image rather than the cached SHA
          UPDATE_RESPONSE=$(curl -s -o /tmp/dokploy_update_response.json -w "%{http_code}" \
            -X POST "https://dokploy.prochat.tools/api/application.update" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"applicationId\": \"$DOKPLOY_PREVIEW_APP_ID\",
              \"dockerImage\": \"$NEW_IMAGE\"
            }")

          echo "Image update HTTP status: $UPDATE_RESPONSE"
          if [ "$UPDATE_RESPONSE" != "200" ]; then
            echo "Warning: image update returned $UPDATE_RESPONSE — continuing with deploy (may use previously configured image)"
            cat /tmp/dokploy_update_response.json || true
          else
            echo "Image updated to: $NEW_IMAGE"
          fi

          # Step 2: Trigger the deployment
          RESPONSE=$(curl -s -o /tmp/dokploy_response.json -w "%{http_code}" \
            -X POST "https://dokploy.prochat.tools/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"applicationId\": \"$DOKPLOY_PREVIEW_APP_ID\",
              \"title\": $(echo \"$COMMIT_MSG\" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))'),
              \"description\": $(echo \"$DESCRIPTION\" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')
            }")

          echo "HTTP status: $RESPONSE"
          echo "Deploy API response status recorded (body suppressed from logs)"

          if [ "$RESPONSE" != "200" ]; then
            echo "Dokploy trigger failed with status $RESPONSE"
            exit 1
          fi

          echo "Deployment triggered successfully for: $NEW_IMAGE"
          echo "Provenance: deployed from $(git rev-parse HEAD)"


      - name: Verify staging admin secret readiness
        if: success()
        shell: bash
        env:
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$STAGING_ADMIN_EMAIL" ]; then
            echo "ADMIN-RESPONSIVE-DENIED: repository or preview environment secret STAGING_ADMIN_EMAIL is missing" >&2
            exit 1
          fi
          if [ -z "$STAGING_ADMIN_PASSWORD" ]; then
            echo "ADMIN-RESPONSIVE-DENIED: repository or preview environment secret STAGING_ADMIN_PASSWORD is missing" >&2
            exit 1
          fi
          echo "Required staging admin secret names are configured"

      - name: Wait for deployed preview revision
        if: success()
        env:
          STAGING_URL: https://preview.jpvbootcamp.com
          EXPECTED_DEPLOYMENT_SHA: ${{ github.sha }}
        run: pnpm exec tsx scripts/staging-gates/waitForPreviewDeployment.mts

      - name: Run authenticated admin responsive gate
        if: success()
        env:
          STAGING_URL: https://preview.jpvbootcamp.com
          STAGING_ADMIN_EMAIL: ${{ secrets.STAGING_ADMIN_EMAIL }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: pnpm test:e2e:admin-responsive

      - name: Upload authenticated admin failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-responsive-failure-${{ github.run_id }}
          path: /tmp/jpv-admin-regression-hardening/
          if-no-files-found: ignore
          retention-days: 7

  read-only-plan:
    name: Read-only staging Payload migration plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging-migration-plan
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'read-only-migration-plan'
    permissions:
      contents: read
    concurrency:
      group: staging-payload-migration-plan
      cancel-in-progress: false

    steps:
      - name: Validate inputs — confirmation string
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_CONFIRMATION="run-read-only-staging-payload-migration-plan"
          if [ "${{ inputs.confirmation }}" != "$EXPECTED_CONFIRMATION" ]; then
            echo "PLAN-DENIED: confirmation must be exactly '${EXPECTED_CONFIRMATION}'" >&2
            exit 1
          fi

      - name: Validate inputs — expected_sha is full 40-char SHA
        shell: bash
        run: |
          set -euo pipefail
          INPUT_SHA="${{ inputs.expected_sha }}"
          if ! echo "$INPUT_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "PLAN-DENIED: expected_sha must be exactly 40 lowercase hexadecimal characters, got '${INPUT_SHA:0:12}...'" >&2
            exit 1
          fi

      - name: Validate trigger — reject main branch
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref_name }}" = "main" ]; then
            echo "PLAN-DENIED: this workflow must not run on main." >&2
            exit 1
          fi

      - name: Verify GitHub infrastructure prerequisites
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          ENV_NAME="staging-migration-plan"
          REQUIRED_SECRETS=("DATABASE_URL" "TAILSCALE_OAUTH_CLIENT_ID" "TAILSCALE_OAUTH_SECRET")

          # Verify environment exists
          if ! gh api "repos/${REPO}/environments/${ENV_NAME}" --silent > /tmp/env_info.json 2>/dev/null; then
            echo "PREFLIGHT-DENIED: GitHub environment '${ENV_NAME}' does not exist — create it with at least one required reviewer before dispatching" >&2
            exit 1
          fi

          # Verify at least one required reviewer
          REVIEWER_COUNT=$(jq '.protection_rules | map(select(.type == "required_reviewers")) | .[0].reviewers | length' /tmp/env_info.json 2>/dev/null || echo 0)
          if [ "$REVIEWER_COUNT" -lt 1 ]; then
            echo "PREFLIGHT-DENIED: environment '${ENV_NAME}' has no required reviewers — add at least one before dispatching" >&2
            exit 1
          fi

          # Verify environment secret names exist
          ENV_SECRETS=$(gh api "repos/${REPO}/environments/${ENV_NAME}/secrets" --jq '.secrets[].name' 2>/dev/null || echo "")
          for SECRET in "${REQUIRED_SECRETS[@]}"; do
            if ! echo "$ENV_SECRETS" | grep -qx "$SECRET"; then
              echo "PREFLIGHT-DENIED: environment secret '${SECRET}' is not configured in '${ENV_NAME}'" >&2
              exit 1
            fi
          done

          # Reject same-named repository secrets that would shadow environment secrets
          REPO_SECRETS=$(gh api "repos/${REPO}/actions/secrets" --jq '.secrets[].name' 2>/dev/null || echo "")
          for SECRET in "${REQUIRED_SECRETS[@]}"; do
            if echo "$REPO_SECRETS" | grep -qx "$SECRET"; then
              echo "PREFLIGHT-DENIED: repository secret '${SECRET}' shadows the environment secret — remove the repository-level secret to enforce environment scoping" >&2
              exit 1
            fi
          done

          echo "Infrastructure preflight passed: environment '${ENV_NAME}' exists with ${REVIEWER_COUNT} reviewer(s) and required secrets confirmed"
          rm -f /tmp/env_info.json

      - name: Check out commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Verify exact SHA matches input
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          INPUT_SHA="${{ inputs.expected_sha }}"
          if [ "$ACTUAL_SHA" != "$INPUT_SHA" ]; then
            echo "PLAN-DENIED: checked-out SHA '$ACTUAL_SHA' does not match expected_sha '$INPUT_SHA'" >&2
            exit 1
          fi
          echo "SHA verified: $ACTUAL_SHA"

      - name: Verify SHA is on feature branch — not main, not production
        shell: bash
        run: |
          set -euo pipefail
          ALLOWED_BRANCH="origin/feature/course-branding-and-preview"
          CURRENT_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$CURRENT_SHA" "$ALLOWED_BRANCH" 2>/dev/null; then
            echo "PLAN-DENIED: SHA $CURRENT_SHA is not an ancestor of $ALLOWED_BRANCH" >&2
            echo "Only commits reachable from feature/course-branding-and-preview may run this plan." >&2
            exit 1
          fi
          # Also reject if SHA is reachable from main (would indicate a merged commit)
          if git merge-base --is-ancestor "$CURRENT_SHA" "origin/main" 2>/dev/null; then
            echo "PLAN-DENIED: SHA $CURRENT_SHA is already reachable from main." >&2
            exit 1
          fi
          echo "Feature ancestry confirmed: $CURRENT_SHA is under $ALLOWED_BRANCH and not yet in main"

      - name: Verify SHA matches current remote feature tip
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git rev-parse HEAD)"
          REMOTE_TIP="$(git rev-parse origin/feature/course-branding-and-preview)"
          if [ "$CURRENT_SHA" != "$REMOTE_TIP" ]; then
            echo "PLAN-DENIED: input SHA '$CURRENT_SHA' is not the current remote tip '$REMOTE_TIP'" >&2
            echo "Run pnpm staging:payload-migration-plan locally to confirm the remote tip before dispatching." >&2
            exit 1
          fi
          echo "Remote tip confirmed: $CURRENT_SHA"

      - name: Set up pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Mask DATABASE_URL
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "PLAN-DENIED: DATABASE_URL is not set. The staging-migration-plan environment must provide it." >&2
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@4e7c5a3b2d1e8f6a9c0b7d4e2f1a8c5b3d7e9f2a  # v2 — SHA-pinned immutable ref
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci-reader

      - name: Verify network path to staging host (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          STAGING_HOST="10.0.2.4"
          if ! nc -z -w 5 "$STAGING_HOST" 5433 2>/dev/null; then
            echo "PLAN-DENIED: cannot reach $STAGING_HOST:5433. The approved network path (Tailscale/private NIC) is required." >&2
            echo "Configure the tailscale/github-action step or use a tailnet-connected self-hosted runner." >&2
            exit 1
          fi
          echo "Network path to $STAGING_HOST:5433 confirmed"

      - name: Run read-only Payload migration plan
        id: migration-plan
        shell: bash
        run: |
          set -euo pipefail
          RESULT_FILE=$(mktemp)
          chmod 600 "$RESULT_FILE"
          trap "rm -f \"$RESULT_FILE\"" EXIT
          # Preserve exit status — do not lose it with a pipeline
          set +e
          pnpm run staging:payload-migration-plan -- \
            --expected-commit="${{ inputs.expected_sha }}" \
            --environment=staging \
            --target-id=jpvbootcamp-staging \
            --expected-schema=jpvbootcamp_staging \
            --expected-hostname=10.0.2.4 \
            --expected-database=jpvbootcamp \
            > "$RESULT_FILE" 2>&1
          PLAN_EXIT=$?
          set -e
          # Extract sanitized fields before trap deletes the raw file
          PLAN_OK="$(jq -r '.ok // false' "$RESULT_FILE" 2>/dev/null || echo 'false')"
          # Write sanitized artifact — only safe scalar fields
          jq '{
            ok: (.ok // false),
            mode: (.mode // "plan"),
            branch: (.branch // "unknown"),
            commit: (.commit // "unknown"),
            schema: (.schema // "unknown"),
            environment: (.environment // "unknown"),
            targetId: (.targetId // "unknown"),
            appliedCount: (.appliedCount // 0),
            pendingMigrations: (.pendingMigrations // []),
            blockers: (.blockers // []),
            message: (.message // "")
          }' "$RESULT_FILE" > plan-result-sanitized.json 2>/dev/null \
            || echo '{"ok":false,"message":"artifact sanitization failed"}' > plan-result-sanitized.json
          # Verify sanitized output contains no credential-like strings
          if grep -qiE 'password|secret|token|key=|DATABASE_URL=|postgres://' plan-result-sanitized.json; then
            echo '{"ok":false,"message":"sanitization check failed — credential-like string detected"}' > plan-result-sanitized.json
          fi
          # Emit safe output fields
          if [ "$PLAN_OK" = "true" ] && [ $PLAN_EXIT -eq 0 ]; then
            echo "plan_ok=true" >> "$GITHUB_OUTPUT"
            jq -r '.commit // "unknown"' "$RESULT_FILE" | head -c 40 > /tmp/plan_commit.txt
            echo "plan_commit=$(cat /tmp/plan_commit.txt)" >> "$GITHUB_OUTPUT"
          fi
          # Fail closed — raw file deleted by trap on EXIT
          if [ "$PLAN_OK" != "true" ] || [ $PLAN_EXIT -ne 0 ]; then
            echo "PLAN-BLOCKED: migration plan did not pass. See artifact for sanitized details." >&2
            exit 1
          fi
          echo "Read-only plan passed: $(jq -r '.message // ""' plan-result-sanitized.json)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_MIGRATION_SCHEMA: jpvbootcamp_staging

      - name: Upload sanitized plan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-migration-plan-${{ github.run_id }}
          path: plan-result-sanitized.json
          retention-days: 30
          if-no-files-found: warn
