name: Preview Validation

on:
  push:
    branches:
      - 'feature/**'
      - 'pr/**'
  pull_request:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: preview-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-preview:
    name: Validate release and browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_PUBLIC_URL: http://127.0.0.1:3107
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3107
      E2E_BASE_URL: http://127.0.0.1:3107

    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check payload config
        run: pnpm type-check:payload

      - name: Build application
        run: pnpm run build

      - name: Run deterministic non-browser release gate
        run: pnpm test:release

      - name: Install pinned Chromium browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run launch browser E2E
        run: pnpm test:e2e

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile without publishing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=preview-validation
          cache-to: type=gha,mode=max,scope=preview-validation
