          nc -z -w 5 10.0.2.4 5433
          echo "Approved staging database path is reachable"

      - name: Dry-run administrator-member backfill
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NODE_ENV: production
          PGOPTIONS: "-c statement_timeout=30000 -c lock_timeout=5000"
          DEPLOYMENT_RUNTIME: docker
          DEPLOYMENT_ENV: staging
          PAYLOAD_MIGRATION_SCHEMA: jpvbootcamp
        run: |
          set -euo pipefail
          DRY_RUN_FILE="$(mktemp)"
          DRY_RUN_ERR="$(mktemp)"
          trap 'rm -f "$DRY_RUN_FILE" "$DRY_RUN_ERR"' EXIT
          set +e
          timeout --signal=TERM --kill-after=15s 120s ./node_modules/.bin/tsx scripts/payload/link-administrator-members.mts >"$DRY_RUN_FILE" 2>"$DRY_RUN_ERR"
          BACKFILL_EXIT=$?
          set -e
          if [ "$BACKFILL_EXIT" -ne 0 ]; then
            echo "ADMIN-BACKFILL-DENIED: dry-run failed; sanitized diagnostics follow" >&2
            sed -E \
              -e 's#postgres(ql)?://[^[:space:]]+#postgresql://[redacted]#g' \
              -e 's#(DATABASE_URL|PAYLOAD_SECRET|.*SECRET.*)=([^[:space:]]+)#\1=[redacted]#g' \
              -e 's#(password|token|secret)[=:][^[:space:]]+#\1=[redacted]#Ig' \
              "$DRY_RUN_ERR" | tail -n 80 >&2 || true
            exit "$BACKFILL_EXIT"
          fi
          node - "$DRY_RUN_FILE" <<'NODE'
          const fs = require('node:fs')
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (data.apply !== false || !Array.isArray(data.administrators)) process.exit(1)
          const blocked = data.administrators.filter((row) => ['ambiguous', 'invalid', 'skipped_missing_email'].includes(row.status))
          if (blocked.length > 0) {
            console.error('ADMIN-BACKFILL-DENIED: dry-run found unresolved administrator identities')
            process.exit(2)
          }
          console.log(`Dry-run resolved ${data.administrators.length} administrator identities with no unresolved matches`)
          NODE

      - name: Apply guarded administrator-member backfill
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NODE_ENV: production
          PGOPTIONS: "-c statement_timeout=30000 -c lock_timeout=5000"
          DEPLOYMENT_RUNTIME: docker
          DEPLOYMENT_ENV: staging
          PAYLOAD_MIGRATION_SCHEMA: jpvbootcamp
          ADMIN_MEMBER_IDENTITY_APPLY: "true"
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          OPERATOR_ID: ${{ github.actor }}
        run: |
          set -euo pipefail
          APPLY_FILE="$(mktemp)"
          APPLY_ERR="$(mktemp)"
          trap 'rm -f "$APPLY_FILE" "$APPLY_ERR"' EXIT
          set +e
          timeout --signal=TERM --kill-after=15s 120s ./node_modules/.bin/tsx scripts/payload/link-administrator-members.mts --apply >"$APPLY_FILE" 2>"$APPLY_ERR"
          BACKFILL_EXIT=$?
          set -e
          if [ "$BACKFILL_EXIT" -ne 0 ]; then
            echo "ADMIN-BACKFILL-DENIED: guarded apply failed; sanitized diagnostics follow" >&2
            sed -E \
              -e 's#postgres(ql)?://[^[:space:]]+#postgresql://[redacted]#g' \
              -e 's#(DATABASE_URL|PAYLOAD_SECRET|.*SECRET.*)=([^[:space:]]+)#\1=[redacted]#g' \
              -e 's#(password|token|secret)[=:][^[:space:]]+#\1=[redacted]#Ig' \
              "$APPLY_ERR" | tail -n 80 >&2 || true
            exit "$BACKFILL_EXIT"
          fi
          node - "$APPLY_FILE" "$EXPECTED_SHA" "$OPERATOR_ID" <<'NODE'
          const fs = require('node:fs')
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
          if (data.apply !== true || !Array.isArray(data.administrators)) process.exit(1)
          const blocked = data.administrators.filter((row) => ['ambiguous', 'invalid', 'skipped_missing_email', 'skipped_ambiguous', 'skipped_invalid'].includes(row.status))
          if (blocked.length > 0) {
            console.error('ADMIN-BACKFILL-DENIED: apply left unresolved administrator identities')
            process.exit(2)
          }
          const statusCounts = {}
          for (const row of data.administrators) statusCounts[row.status] = (statusCounts[row.status] || 0) + 1
          const result = {
            version: 1,
            operation: 'guarded-administrator-member-backfill',
            environment: 'staging',
            targetId: 'jpvbootcamp-staging',
            database: 'jpvbootcamp_staging',
            schema: 'jpvbootcamp',
            commit: process.argv[3],
            operator: process.argv[4],
            administratorCount: data.administrators.length,
            linkedMemberCount: data.administrators.filter((row) => typeof row.memberId === 'string' && row.memberId.length > 0).length,
            statusCounts,
          }
          fs.writeFileSync('administrator-backfill-result.json', JSON.stringify(result, null, 2) + '\n', { mode: 0o600 })
          console.log(`Guarded administrator-member backfill applied for ${result.administratorCount} identities`)
          NODE

      - name: Upload PII-free administrator backfill evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-administrator-member-backfill-${{ github.run_id }}
          path: administrator-backfill-result.json
          retention-days: 30
          if-no-files-found: ignore

  seed-staging-qa-content:
    name: Guarded staging QA course content seed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging-migration-plan
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'seed-staging-qa-content'
    permissions:
      contents: read

    steps:
      - name: Validate inputs and staging boundary
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.expected_sha }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$INPUT_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "COURSE-SEED-DENIED: expected_sha must be a full lowercase SHA" >&2
            exit 1
          fi
          if ! printf '%s' "$INPUT_SOURCE_REF" | grep -qE '^(feature|fix|release)/[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "COURSE-SEED-DENIED: source_ref must match feature/*, fix/*, or release/*" >&2
            exit 1
          fi
          if [ "$INPUT_CONFIRMATION" != "apply-guarded-staging-qa-content-seed" ]; then
            echo "COURSE-SEED-DENIED: confirmation phrase is invalid" >&2
            exit 1
          fi
          echo "Guarded QA seed is restricted to the canonical staging database"
          echo "target=jpvbootcamp_staging schema=jpvbootcamp host=10.0.2.4 port=5433"

      - name: Check out approved source ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Attach and verify exact source tip
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_REF_INPUT: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          git switch --force-create "$SOURCE_REF_INPUT" HEAD
          test "$(git branch --show-current)" = "$SOURCE_REF_INPUT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if git merge-base --is-ancestor "$EXPECTED_SHA" origin/main 2>/dev/null; then
            echo "COURSE-SEED-DENIED: source SHA is already reachable from main" >&2
            exit 1
          fi
          test "$(git rev-parse "origin/$SOURCE_REF_INPUT")" = "$EXPECTED_SHA"
          echo "Source branch and remote tip verified"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Verify and mask required staging secrets
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TAILSCALE_OAUTH_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          test -n "${PAYLOAD_SECRET:-}"
          test -n "${TAILSCALE_OAUTH_CLIENT_ID:-}"
          test -n "${TAILSCALE_OAUTH_SECRET:-}"
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$PAYLOAD_SECRET"
          echo "Required staging QA seed secrets are present"

      - name: Connect to approved staging database network
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci-reader

      - name: Probe approved staging database path
        shell: bash
        run: |
          set -euo pipefail
          tailscale ping --timeout=10s 10.0.2.4
          nc -z -w 5 10.0.2.4 5433
          echo "Approved staging database path is reachable"

      - name: Verify canonical staging target before dry-run or apply
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOYMENT_ENV: staging
        run: |
          set -euo pipefail
          TARGET="$(./node_modules/.bin/tsx scripts/payload/verify-staging-course-seed-target.mts)"
          node -e 'const t=JSON.parse(process.argv[1]); if(t.environment!=="staging"||t.host!=="10.0.2.4"||t.port!=="5433"||t.database!=="jpvbootcamp_staging"||t.schema!=="jpvbootcamp"||t.role!=="jpvbootcamp_staging_app") process.exit(1)' "$TARGET"
          echo "Canonical staging target verified"

      - name: Dry-run canonical QA course seed
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NODE_ENV: production
          DEPLOYMENT_ENV: staging
          PGOPTIONS: "-c statement_timeout=30000 -c lock_timeout=5000"
        run: |
          set -euo pipefail
          OUT="$(mktemp)"; ERR="$(mktemp)"
          trap 'rm -f "$OUT" "$ERR"' EXIT
          if ! timeout --signal=TERM --kill-after=15s 120s pnpm payload:course:seed >"$OUT" 2>"$ERR"; then
            node -e 'const fs=require("node:fs"); const value=fs.readFileSync(process.argv[1],"utf8").replaceAll(process.env.DATABASE_URL||"","[redacted-database-url]").replaceAll(process.env.PAYLOAD_SECRET||"","[redacted-payload-secret]"); const lines=value.split(String.fromCharCode(10)).filter(Boolean).slice(-8); console.error(`COURSE-SEED-DENIED: dry-run failed (${lines.join(" | ").slice(0,2400)})`)' "$ERR"
            exit 1
          fi
          grep -q '\[seed:dry-run\] Summary' "$OUT"
          grep -q 'No records were written' "$OUT"
          echo "QA seed dry-run passed with no writes"

      - name: Apply guarded canonical QA course seed
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NODE_ENV: production
          DEPLOYMENT_ENV: staging
          PGOPTIONS: "-c statement_timeout=30000 -c lock_timeout=5000"
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          OUT="$(mktemp)"; ERR="$(mktemp)"
          trap 'rm -f "$OUT" "$ERR"' EXIT
          if ! timeout --signal=TERM --kill-after=15s 120s pnpm payload:course:seed -- --apply >"$OUT" 2>"$ERR"; then
            node -e 'const fs=require("node:fs"); const value=fs.readFileSync(process.argv[1],"utf8").replaceAll(process.env.DATABASE_URL||"","[redacted-database-url]").replaceAll(process.env.PAYLOAD_SECRET||"","[redacted-payload-secret]"); const lines=value.split(String.fromCharCode(10)).filter(Boolean).slice(-8); console.error(`COURSE-SEED-DENIED: guarded apply failed (${lines.join(" | ").slice(0,2400)})`)' "$ERR"
            exit 1
          fi
          grep -q '\[seed\] Summary' "$OUT"
          node - "$OUT" "$EXPECTED_SHA" <<'NODE'
          const fs = require('node:fs')
          const output = fs.readFileSync(process.argv[2], 'utf8')
          const match = output.match(/\[seed\] Summary\s+\{\s*create:\s*(\d+),\s*update:\s*(\d+),\s*skip:\s*(\d+)\s*\}/)
          if (!match) process.exit(1)
          const result = {
            version: 1,
            operation: 'guarded-staging-qa-content-seed',
            environment: 'staging',
            targetId: 'jpvbootcamp-staging',
            database: 'jpvbootcamp_staging',
            schema: 'jpvbootcamp',
            commit: process.argv[3],
            create: Number(match[1]),
            update: Number(match[2]),
            skip: Number(match[3]),
          }
          fs.writeFileSync('staging-qa-content-seed-result.json', JSON.stringify(result, null, 2) + '\n', { mode: 0o600 })
          console.log(`Guarded QA content seed applied: create=${result.create} update=${result.update} skip=${result.skip}`)
          NODE

      - name: Upload sanitized QA seed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-qa-content-seed-${{ github.run_id }}
          path: staging-qa-content-seed-result.json
          retention-days: 30
          if-no-files-found: ignore
