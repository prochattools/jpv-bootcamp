          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          if git merge-base --is-ancestor "$EXPECTED_SHA" origin/main 2>/dev/null; then
            echo "ADMIN-BACKFILL-DENIED: source SHA is already reachable from main" >&2
            exit 1
          fi
          test "$(git rev-parse "origin/$SOURCE_REF_INPUT")" = "$EXPECTED_SHA"
          echo "Source branch and remote tip verified"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Set up Node.js
