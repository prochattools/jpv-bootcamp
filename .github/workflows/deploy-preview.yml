name: Preview Validation

on:
  push:
    branches:
      - 'feature/**'
      - 'pr/**'
  pull_request:
    branches:
      - main
      - 'feature/**'

permissions:
  contents: read

concurrency:
  group: preview-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-preview:
    name: Validate preview release inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_PUBLIC_URL: https://preview.jpvbootcamp.test
      NEXT_PUBLIC_APP_URL: https://preview.jpvbootcamp.test

    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run preview and release safety tests
        run: |
          pnpm exec tsx scripts/preview_readiness_config.test.ts
          pnpm exec tsx scripts/preview_startup_mode.test.ts
          pnpm exec tsx scripts/preview_workflow_safety.test.ts
          pnpm exec tsx scripts/preview_release_manifest.test.ts
          pnpm exec tsx scripts/preview_release_preflight.test.ts
          pnpm exec tsx scripts/preview_smoke_plan.test.ts

      - name: Type-check
        run: pnpm type-check:payload

      - name: Build application
        run: pnpm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile without publishing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=preview-validation
          cache-to: type=gha,mode=max,scope=preview-validation
