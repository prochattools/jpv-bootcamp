# Deploy feature branches to preview/staging environment.
# - Builds Docker image on GitHub
# - Pushes to GHCR with branch tag
# - Triggers Dokploy preview app redeployment
#
# Required GitHub secrets:
#   DOKPLOY_PREVIEW_APP_ID — Dokploy application ID for the preview/staging app
#   DOKPLOY_API_KEY        — Dokploy server API key
#   DOKPLOY_API_BASE_URL   — Dokploy API base URL (e.g., https://dokploy.prochat.tools)

name: Build and Deploy to Preview

on:
  push:
    branches:
      - 'feature/**'
      - 'pr/**'

jobs:
  build-and-deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker tag
        id: docker-tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAG="latest"
          else
            TAG=$(echo "${{ github.ref_name }}" | sed 's|/|-|g')
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.docker-tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy preview redeploy
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" ${{ github.sha }})
          COMMIT_AUTHOR=$(git log -1 --pretty=format:"%an" ${{ github.sha }})
          COMMIT_DATE=$(git log -1 --pretty=format:"%ci" ${{ github.sha }})
          DESCRIPTION="${COMMIT_AUTHOR} · ${COMMIT_DATE}"$'\n\n'"${{ github.sha }}"

          RESPONSE=$(curl -s -o /tmp/dokploy_response.json -w "%{http_code}" \
            -X POST "${{ secrets.DOKPLOY_API_BASE_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"applicationId\": \"${{ secrets.DOKPLOY_PREVIEW_APP_ID }}\",
              \"title\": $(echo "$COMMIT_MSG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))'),
              \"description\": $(echo "$DESCRIPTION" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')
            }")

          echo "HTTP status: $RESPONSE"
          cat /tmp/dokploy_response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "Dokploy preview trigger failed with status $RESPONSE"
            exit 1
          fi

          echo "Preview deployment triggered successfully for branch: ${{ github.ref_name }}"
