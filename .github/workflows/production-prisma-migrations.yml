name: Apply Production Prisma Migrations

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full 40-character SHA already serving the root production application
        required: true
        type: string
      confirmation:
        description: Type apply-prisma-migrations-production to confirm the guarded migration job
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-prisma-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply guarded production Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: root-domain-image-publish
    env:
      ALLOWED_BRANCH: main
      TARGET_ORIGIN: https://jpvbootcamp.com
      DOKPLOY_APPLICATION_ID: I_2Vukga3cc3ZhaG-mUzU
      DOKPLOY_APPLICATION_NAME: clients-jpv-bootcamp-app-tp9xrk
      DOKPLOY_API_BASE_URL: https://dokploy.prochat.tools/api
      EXPECTED_DEPLOYMENT_SHA: ${{ inputs.expected_sha }}
      MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Validate production boundary and confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "$ALLOWED_BRANCH" ]; then
            echo "PRISMA-MIGRATION-DENIED: only $ALLOWED_BRANCH is permitted" >&2
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_DEPLOYMENT_SHA" | grep -qE '^[0-9a-f]{40}$'; then
            echo "PRISMA-MIGRATION-DENIED: expected_sha must be a full lowercase 40-character SHA" >&2
            exit 1
          fi
          if [ "$MIGRATION_CONFIRMATION" != "apply-prisma-migrations-production" ]; then
            echo "PRISMA-MIGRATION-DENIED: confirmation phrase is invalid" >&2
            exit 1
          fi
          echo "Production migration lane: $DOKPLOY_APPLICATION_NAME at $TARGET_ORIGIN"

      - name: Check out the expected release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Verify expected release is on main
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_DEPLOYMENT_SHA" ]; then
            echo "PRISMA-MIGRATION-DENIED: checked out SHA does not match expected_sha" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$actual_sha" "origin/$ALLOWED_BRANCH"; then
            echo "PRISMA-MIGRATION-DENIED: expected SHA is not reachable from $ALLOWED_BRANCH" >&2
            exit 1
          fi
          echo "Expected release source verified: $actual_sha"

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run guarded production migration job
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: pnpm exec tsx scripts/release/runProductionPrismaMigration.mts
