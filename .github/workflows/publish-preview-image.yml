name: Publish Staging Image

# Third-party action SHAs pinned to verified releases:
#   actions/checkout@v4          -> 11d5960a326750d5838078e36cf38b85af677262
#   actions/setup-node@v4        -> 49933ea5288caeca8642d1e84afbd3f7d6820020
#   docker/setup-buildx-action   -> 8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
#   docker/login-action          -> c94ce9fb468520275223c153574b00df6fe4bcc9
#   docker/build-push-action     -> ca052bb54ab0790a636c9b5f226502c73d547a25
#   actions/upload-artifact@v4   -> ea165f8d65b6e75b540449e92b4886f43607fa02

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to publish (must be current tip of source_ref)
        required: true
        type: string
      source_ref:
        description: 'Approved source ref: feature/*, fix/*, or release/* (never main)'
        required: true
        type: string
      confirmation:
        description: Type publish-preview-image to confirm image publication only
        required: true
        type: string
      release_label:
        description: Optional immutable release label for the manifest
        required: false
        type: string
      source_date:
        description: Reproducible source date or build timestamp for labels and manifest
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: staging-image-publish
  cancel-in-progress: false

jobs:
  publish-preview-image:
    name: Publish staging image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging-image-publish

    env:
      REQUESTED_SHA: ${{ inputs.commit_sha }}
      TARGET_ENVIRONMENT: staging
      STAGING_ORIGIN: https://staging.jpvbootcamp.com
      CONFIRMATION: ${{ inputs.confirmation }}
      RELEASE_LABEL: ${{ inputs.release_label }}
      SOURCE_DATE: ${{ inputs.source_date }}
      SOURCE_REF: ${{ inputs.source_ref }}

    steps:
      - name: Validate inputs and staging boundary
        shell: bash
        run: |
          set -euo pipefail
          # Commit SHA format
          case "$REQUESTED_SHA" in
            *[!0-9a-fA-F]*)
              echo "PUBLISH-DENIED: commit_sha must be hexadecimal" >&2
              exit 1
              ;;
          esac
          if [ "${#REQUESTED_SHA}" -ne 40 ]; then
            echo "PUBLISH-DENIED: commit_sha must be exactly 40 characters" >&2
            exit 1
          fi
          # Confirmation phrase
          if [ "$CONFIRMATION" != "publish-preview-image" ]; then
            echo "PUBLISH-DENIED: confirmation must be 'publish-preview-image'" >&2
            exit 1
          fi
          # Source date
          if [ -z "$SOURCE_DATE" ]; then
            echo "PUBLISH-DENIED: source_date is required" >&2
            exit 1
          fi
          if ! printf '%s' "$SOURCE_REF" | grep -qE '^(feature|fix|release)/[A-Za-z0-9][A-Za-z0-9._-]*$'; then
            echo "PUBLISH-DENIED: source_ref must match feature/*, fix/*, or release/*; got '$SOURCE_REF'" >&2
            exit 1
          fi
          if [ "$SOURCE_REF" = "main" ]; then
            echo "PUBLISH-DENIED: source_ref main is never allowed for staging" >&2
            exit 1
          fi

      - name: Check out approved source ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Attach approved source ref for provenance
        shell: bash
        run: git switch --force-create "$SOURCE_REF" HEAD

      - name: Verify requested SHA is current remote tip of approved source ref
        shell: bash
        run: |
          set -euo pipefail
          BRANCH_TIP="$(git rev-parse HEAD)"
          if [ "$BRANCH_TIP" != "$REQUESTED_SHA" ]; then
            echo "PUBLISH-DENIED: requested SHA ($REQUESTED_SHA) does not match current tip of $SOURCE_REF ($BRANCH_TIP)" >&2
            echo "Only the current remote tip may be published." >&2
            exit 1
          fi
          REMOTE_TIP="$(git rev-parse "origin/$SOURCE_REF")"
          if [ "$BRANCH_TIP" != "$REMOTE_TIP" ]; then
            echo "PUBLISH-DENIED: requested SHA is not the current remote tip of $SOURCE_REF" >&2
            exit 1
          fi
          echo "SHA verified: $REQUESTED_SHA is the current remote tip of $SOURCE_REF"

      - name: Capture checkout SHA
        id: checkout-sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate release manifest
        shell: bash
        run: |
          set -euo pipefail
          pnpm --silent preview:release:manifest \
            --repository="${{ github.repository }}" \
            --commit-sha="${{ steps.checkout-sha.outputs.sha }}" \
            --image-reference="ghcr.io/${{ github.repository }}:${{ steps.checkout-sha.outputs.sha }}" \
            --target-environment="staging" \
            --startup-mode=application-only \
            --deployment-runtime=docker \
            --source-date="$SOURCE_DATE" \
            --release-label="$RELEASE_LABEL" \
            > preview-release-manifest.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine publish tags
        id: publish-tags
        shell: bash
        run: |
          set -euo pipefail
          sha_tag="ghcr.io/${{ github.repository }}:${{ steps.checkout-sha.outputs.sha }}"
          staging_tag="ghcr.io/${{ github.repository }}:staging"
          {
            echo "tags<<EOF"
            echo "$staging_tag"
            echo "$sha_tag"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.publish-tags.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_APP_URL=https://staging.jpvbootcamp.com
            APP_BASE_URL=https://staging.jpvbootcamp.com
            NEXT_PUBLIC_SERVER_URL=https://staging.jpvbootcamp.com
            IMAGE_TAG=${{ steps.checkout-sha.outputs.sha }}
            COMMIT_SHA=${{ steps.checkout-sha.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.checkout-sha.outputs.sha }}
            org.opencontainers.image.created=${{ env.SOURCE_DATE }}
            org.opencontainers.image.version=${{ env.RELEASE_LABEL }}
            dev.jpvbootcamp.staging-origin=https://staging.jpvbootcamp.com
            dev.jpvbootcamp.source-ref=${{ inputs.source_ref }}
          cache-from: type=gha,scope=staging-image-publish
          cache-to: type=gha,mode=max,scope=staging-image-publish

      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: preview-release-manifest-${{ steps.checkout-sha.outputs.sha }}
          path: preview-release-manifest.json

      - name: Report image reference
        shell: bash
        run: |
          set -euo pipefail
          echo "Published image: ghcr.io/${{ github.repository }}:${{ steps.checkout-sha.outputs.sha }}"
          echo "Staging tag: ghcr.io/${{ github.repository }}:staging"
          echo "Staging origin: https://staging.jpvbootcamp.com"
          echo "Image publication does not deploy, run migrations, or invoke provider email."
