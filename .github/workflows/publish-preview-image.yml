name: Publish Preview Image

on:
  push:
    branches:
      - 'feature/**'
      - 'pr/**'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to publish
        required: true
        type: string
      target_environment:
        description: Target environment label for publication metadata
        required: true
        type: choice
        options:
          - preview
          - staging
      confirmation:
        description: Type publish-preview-image to confirm image publication only
        required: true
        type: string
      release_label:
        description: Optional immutable release label for the manifest
        required: false
        type: string
      source_date:
        description: Reproducible source date or build timestamp for labels and manifest
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: preview-image-publish-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'staging' }}
  cancel-in-progress: false

jobs:
  publish-preview-image:
    name: Publish preview image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: preview-image-publish

    env:
      REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_sha || github.sha }}
      TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'staging' }}
      CONFIRMATION: ${{ inputs.confirmation }}
      RELEASE_LABEL: ${{ inputs.release_label }}
      SOURCE_DATE: ${{ inputs.source_date }}

    steps:
      - name: Validate manual inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          case "$REQUESTED_SHA" in
            *[!0-9a-fA-F]*)
              echo "commit_sha must be a hexadecimal Git SHA" >&2
              exit 1
              ;;
          esac
          if [ "${#REQUESTED_SHA}" -ne 40 ]; then
            echo "commit_sha must be exactly 40 characters" >&2
            exit 1
          fi
          if [ "$CONFIRMATION" != "publish-preview-image" ]; then
            echo "confirmation must be publish-preview-image" >&2
            exit 1
          fi
          if [ -z "$SOURCE_DATE" ]; then
            echo "source_date is required" >&2
            exit 1
          fi

      - name: Check out requested commit
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - name: Check out push commit
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify checked-out commit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$REQUESTED_SHA" ]; then
            echo "Checked-out commit does not match requested commit" >&2
            exit 1
          fi
          echo "Publishing image for commit $ACTUAL_SHA"

      - name: Capture checkout SHA
        id: checkout-sha
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute source date
        id: source-date
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            source_date_value="$SOURCE_DATE"
          else
            source_date_value="$(git log -1 --pretty=format:%cI HEAD)"
          fi
          echo "value=$source_date_value" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate release manifest
        shell: bash
        run: |
          set -euo pipefail
          pnpm --silent preview:release:manifest \
            --repository="${{ github.repository }}" \
            --commit-sha="${{ steps.checkout-sha.outputs.sha }}" \
            --image-reference="ghcr.io/${{ github.repository }}:${{ steps.checkout-sha.outputs.sha }}" \
            --target-environment="$TARGET_ENVIRONMENT" \
            --startup-mode=application-only \
            --deployment-runtime=docker \
            --source-date="${{ steps.source-date.outputs.value }}" \
            --release-label="$RELEASE_LABEL" \
            > preview-release-manifest.json

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine publish tags
        id: publish-tags
        shell: bash
        run: |
          set -euo pipefail
          sha_tag="ghcr.io/${{ github.repository }}:${{ steps.checkout-sha.outputs.sha }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            branch_ref="${{ github.ref_name }}"
            branch_tag="ghcr.io/${{ github.repository }}:$(printf '%s' "$branch_ref" | sed 's|/|-|g')"
            {
              echo "tags<<EOF"
              echo "$branch_tag"
              echo "$sha_tag"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "$sha_tag"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish immutable image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.publish-tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.checkout-sha.outputs.sha }}
            org.opencontainers.image.created=${{ steps.source-date.outputs.value }}
            org.opencontainers.image.version=${{ env.RELEASE_LABEL }}
          cache-from: type=gha,scope=preview-image-publish
          cache-to: type=gha,mode=max,scope=preview-image-publish

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: preview-release-manifest-${{ steps.checkout-sha.outputs.sha }}
          path: preview-release-manifest.json

      - name: Report image reference
        shell: bash
        run: |
          set -euo pipefail
          echo "Published image sha: ghcr.io/${{ github.repository }}:${{ steps.checkout-sha.outputs.sha }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            branch_ref="${{ github.ref_name }}"
            echo "Published image branch tag: ghcr.io/${{ github.repository }}:$(printf '%s' "$branch_ref" | sed 's|/|-|g')"
          fi
          echo "Image publication does not deploy, run migrations, start database-deploy mode, or invoke provider email."
