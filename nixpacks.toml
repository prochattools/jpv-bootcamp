[phases.setup]
nixPkgs = ["nodejs_20", "openssl", "postgresql_15"]

[phases.install]
cmds = [
  "npm install -g pnpm@10.33.0",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = ["NODE_OPTIONS=--max-old-space-size=3072 pnpm run build"]

[start]
cmd = "bash scripts/runtime/start-staging.sh"
